<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pve-01 · Inventário Homelab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand__mark" id="brandMark" aria-hidden="true"></span>
      <div class="brand__text">
        <strong class="brand__name">pve-01</strong>
        <span class="brand__sub">homelab</span>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="Seções"></nav>

    <div class="sidebar__foot">
      <div class="mini">
        <span class="mini__label">Proxmox</span>
        <span class="mini__value">9.2.2</span>
      </div>
      <div class="mini">
        <span class="mini__label">Kernel</span>
        <span class="mini__value mono">7.0.2-6-pve</span>
      </div>
      <div class="mini">
        <span class="mini__label">Endereço</span>
        <span class="mini__value mono">192.168.15.200</span>
      </div>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <button class="topbar__menu" id="menuBtn" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar__title">
        <h1 class="topbar__host">pve-01<span class="topbar__dot">·</span><span class="topbar__dom">home.arpa</span></h1>
        <p class="topbar__crumbs" id="crumbs">Visão Geral</p>
      </div>
      <div class="topbar__right">
        <span class="pill pill--ok" id="onlinePill"><i class="pill__dot"></i>online</span>
        <span class="topbar__clock mono" id="clock">--:--:--</span>
      </div>
    </header>

    <main class="main" id="main"></main>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal__backdrop" id="modalBackdrop"></div>
    <div class="modal__panel" id="modalPanel" role="document"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>

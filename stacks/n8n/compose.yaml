name: homelab-n8n

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    restart: unless-stopped

    mem_limit: 512m

    env_file:
      - /etc/homelab/n8n/postgres.env

    environment:
      POSTGRES_USER: postgres

      N8N_DB_NAME: n8n
      N8N_DB_USER: n8n_app

      RAG_DB_NAME: rag
      RAG_DB_USER: rag_app

    volumes:
      - /srv/homelab/n8n/postgres:/var/lib/postgresql/data
      - /opt/homelab/stacks/n8n/postgres/init:/docker-entrypoint-initdb.d:ro

    networks:
      - database

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d postgres
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s


  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.7
    restart: unless-stopped

    mem_limit: 640m

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - /etc/homelab/n8n/n8n.env
      - /etc/homelab/n8n/runners.env

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n_app
      DB_POSTGRESDB_SCHEMA: public

      N8N_HOST: n8n.homelab.edmaker.dev.br
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://n8n.homelab.edmaker.dev.br/
      N8N_WEBHOOK_URL: https://n8n.homelab.edmaker.dev.br/
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"

      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: "0.0.0.0"
      N8N_NATIVE_PYTHON_RUNNER: "true"

      # Security / runtime baseline
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "300"

      # Compression safety limits
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"

      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo

    volumes:
      - /srv/homelab/n8n/app:/home/node/.n8n

    ports:
      - "192.168.15.220:5678:5678"

    networks:
      - database
      - runners
      - egress
      - homelab-edge

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


  task-runners:
    image: n8nio/runners:2.40.7
    restart: unless-stopped

    mem_limit: 512m

    depends_on:
      n8n:
        condition: service_healthy

    env_file:
      - /etc/homelab/n8n/runners.env

    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
      N8N_RUNNERS_TASK_TIMEOUT: "300"
    
    volumes:
      - /opt/homelab/stacks/n8n/runners/n8n-task-runners.json:/etc/n8n-task-runners.json:ro

    networks:
      - runners


networks:
  database:
    driver: bridge
    internal: true

  runners:
    driver: bridge
    internal: true

  egress:
    driver: bridge

  homelab-edge:
    external: true
    name: homelab-edge

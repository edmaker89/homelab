---
- name: Load automation password from existing SOPS contract
  ansible.builtin.set_fact:
    postgres_automation_secrets: "{{ lookup('community.sops.sops', postgres_automation_sops_file, rstrip=false) | from_yaml }}"
  no_log: true

- name: Validate automation password
  ansible.builtin.assert:
    that:
      - postgres_automation_secrets.automation_db_password is defined
      - postgres_automation_secrets.automation_db_password is string
      - postgres_automation_secrets.automation_db_password is match('^[a-fA-F0-9]{64}$')
      - postgres_automation_secrets.automation_db_password | length == 64
    fail_msg: Fill automation_db_password in secrets/n8n.sops.yaml with 64 hexadecimal characters using SOPS.
  no_log: true

- name: Ensure provisioner directory exists
  ansible.builtin.file:
    path: /usr/local/lib/homelab-postgres-automation
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Install automation provisioner
  ansible.builtin.copy:
    src: provision.py
    dest: /usr/local/lib/homelab-postgres-automation/provision.py
    owner: root
    group: root
    mode: '0700'

- name: Provision automation without recreating PostgreSQL
  ansible.builtin.command:
    argv:
      - flock
      - -w
      - '60'
      - /run/lock/homelab-postgres-automation.lock
      - python3
      - /usr/local/lib/homelab-postgres-automation/provision.py
    stdin: "{{ {'password': postgres_automation_secrets.automation_db_password, 'stack_dir': postgres_automation_stack_dir} | to_json }}"
  register: postgres_automation_result
  changed_when: (postgres_automation_result.stdout | from_json).changed | bool
  when: not ansible_check_mode
  no_log: true

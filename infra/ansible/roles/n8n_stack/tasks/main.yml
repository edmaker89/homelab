---
- name: Load n8n secrets from SOPS
  ansible.builtin.set_fact:
    n8n_secrets: >-
      {{
        lookup(
          'community.sops.sops',
          n8n_sops_file
        ) | from_yaml
      }}
  no_log: true

- name: Validate required n8n secrets
  ansible.builtin.assert:
    that:
      - n8n_secrets.postgres_admin_password is defined
      - n8n_secrets.postgres_admin_password | length == 64

      - n8n_secrets.n8n_db_password is defined
      - n8n_secrets.n8n_db_password | length == 64

      - n8n_secrets.rag_db_password is defined
      - n8n_secrets.rag_db_password | length == 64

      - n8n_secrets.n8n_encryption_key is defined
      - n8n_secrets.n8n_encryption_key | length == 64
  no_log: true

- name: Ensure n8n stack directory exists
  ansible.builtin.file:
    path: "{{ n8n_stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure n8n configuration directory exists
  ansible.builtin.file:
    path: "{{ n8n_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Ensure n8n data root exists
  ansible.builtin.file:
    path: "{{ n8n_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure PostgreSQL persistent data directory exists
  ansible.builtin.file:
    path: "{{ n8n_postgres_data_dir }}"
    state: directory
    owner: "{{ n8n_postgres_uid }}"
    group: "{{ n8n_postgres_gid }}"
    mode: "0700"

- name: Ensure n8n persistent application data directory exists
  ansible.builtin.file:
    path: "{{ n8n_app_data_dir }}"
    state: directory
    owner: "{{ n8n_app_uid }}"
    group: "{{ n8n_app_gid }}"
    mode: "0700"

- name: Deploy PostgreSQL environment secrets
  ansible.builtin.template:
    src: postgres.env.j2
    dest: "{{ n8n_postgres_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Deploy n8n application environment secrets
  ansible.builtin.template:
    src: n8n.env.j2
    dest: "{{ n8n_app_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Ensure PostgreSQL initialization directory exists
  ansible.builtin.file:
    path: "{{ n8n_postgres_init_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy PostgreSQL initialization scripts
  ansible.builtin.copy:
    src: "{{ n8n_local_stack_source }}/postgres/init/"
    dest: "{{ n8n_postgres_init_dir }}/"
    owner: root
    group: root
    mode: "0755"
